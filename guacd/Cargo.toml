[package]
name = "guacd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embed Apache guacamole-server (guacd) in-process: start it without a listening socket, open connections, and read/write the Guacamole protocol"

[dependencies]
guacd-sys = { path = "../guacd-sys", version = "0.1.0" }
libc.workspace = true
log.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["net"] }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
