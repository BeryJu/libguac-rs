name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    # guacd-sys only supports Linux x86_64/aarch64; matrix covers both via
    # GitHub's native amd64 and arm64 hosted runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config autoconf automake libtool libtool-bin \
            clang libclang-dev \
            libcairo2-dev libjpeg-turbo8-dev libpng-dev libwebp-dev \
            libpango1.0-dev uuid-dev libossp-uuid-dev libssl-dev \
            libvncserver-dev \
            freerdp2-dev libwinpr2-dev \
            libssh2-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose
